name: Recover stuck AG Pages deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --show-error --location --output /tmp/pages-cancel-response --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Rujumagil/Academia-AG-Networking/pages/deployments/0c8e08e87151001caee48eeca31ea3018e69e5cf/cancel')
          echo "Cancellation HTTP status: ${code}"
          if [ "${code}" != "204" ]; then
            cat /tmp/pages-cancel-response
            exit 1
          fi
          echo 'Stuck deployment cancellation accepted.'
