name: Academia AG release checks

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production JavaScript syntax
        run: |
          node --check bootstrap.js
          node --check app.js
          node --check supabase-config.js
          node --check sw.js
          node --check utah-course-runtime.js
          node --check utah-module-exam-v2.js
          node --check utah-module2-exam-v2.js
          node --check utah-module3-exam-v2.js
          node --check utah-module4-exam-v2.js
          node --check utah-module5-exam-v2.js
          node --check utah-module6-exam-v2.js
          node --check utah-sequential-lock-v57.js
          node --check utah-clean-ui-v66.js
          node --check utah-student-flow-v70.js
          node --check utah-auditor-hotfix-v83.js
          node --check utah-c3-promo-force-v85.js
          node --check academy-student-polish-v71.js
          node --check academy-academic-polish-v72.js
          node --check utah-course-images-v67.js
          node --check utah-official-cover-v73.js
          node --check course-access-request-v75.js
          node --check student-home-catalog-v77.js
          node --check student-inline-access-v79.js
          node --check admin-course-requests-v78.js
          node --check admin-course-request-delivery-v86.js
          node --check push-notifications-v80.js
          node --check academy-profile-support-mobile-v81.js
          node --check push-profile-panel-v81.js
          node --check quiz-randomizer.js
          node --check premium-learning.js
          node --check sidebar-icons-premium.js
          node --check evaluaciones-premium.js
          node --check perfil-premium.js
          node --check calendario-premium.js
          node --check admin-dashboard-ejecutivo.js
          node --check admin-dashboard-tabs.js
          node --check first-login-password.js
          node --check admin-import-link.js
          node --check academy-agents.js
          node --check academy-rebuild-state.js

      - name: Validate every local script loaded by bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          from urllib.parse import urlsplit
          text = Path('bootstrap.js').read_text(encoding='utf-8')
          refs = re.findall(r"loadScript\(\s*['\"]([^'\"]+\.js(?:\?[^'\"]*)?)['\"]", text)
          scripts = []
          for ref in refs:
              parsed = urlsplit(ref)
              if parsed.scheme or parsed.netloc or ref.startswith('//'):
                  continue
              path = parsed.path.lstrip('./')
              if path:
                  scripts.append(path)
          scripts = sorted(set(scripts))
          missing = [p for p in scripts if not Path(p).is_file() or Path(p).stat().st_size == 0]
          if missing:
              raise SystemExit('Missing or empty JavaScript loaded by bootstrap: ' + ', '.join(missing))
          for path in scripts:
              subprocess.run(['node', '--check', path], check=True)
          print(f'Validated {len(scripts)} local scripts loaded by bootstrap.js')
          PY

      - name: Validate release wiring v86
        run: |
          test -s academia.html
          test -s manifest.json
          test -s logo-completo-oficial.png
          test -s icon-192.png
          test -s icon-512.png
          test -s supabase-config.js
          test -s sw.js
          test -s academy-profile-support-mobile-v81.js
          test -s push-notifications-v80.js
          test -s push-profile-panel-v81.js
          test -s utah-auditor-hotfix-v83.js
          test -s utah-c3-promo-force-v85.js
          test -s admin-course-request-delivery-v86.js
          test -s quiz-randomizer.js
          test -s supabase/migrations/20260823233000_web_push_notifications.sql
          test -s supabase/functions/send-web-push/index.ts
          python -m json.tool manifest.json >/dev/null
          grep -q '"start_url": "./academia.html"' manifest.json
          grep -q '"display": "standalone"' manifest.json
          grep -q '"src":"icon-192.png"' manifest.json
          grep -q '"src":"icon-512.png"' manifest.json
          grep -q 'bootstrap.js?v=20260824.86' academia.html
          grep -q 'utah-auditor-hotfix-v83.js?v=20260824.83' bootstrap.js
          grep -q 'utah-c3-promo-force-v85.js?v=20260824.85' bootstrap.js
          grep -q 'admin-course-request-delivery-v86.js?v=20260824.86' bootstrap.js
          grep -q 'quiz-randomizer.js?v=20260824.83' bootstrap.js
          grep -q 'academy-profile-support-mobile-v81.js?v=20260823.81' bootstrap.js
          grep -q 'push-notifications-v80.js?v=20260823.80' bootstrap.js
          grep -q 'push-profile-panel-v81.js?v=20260824.81' bootstrap.js
          grep -q "academia-ag-v20260824.86" sw.js
          grep -q './bootstrap.js?v=20260824.86' sw.js
          grep -q './utah-auditor-hotfix-v83.js?v=20260824.83' sw.js
          grep -q './utah-c3-promo-force-v85.js?v=20260824.85' sw.js
          grep -q './admin-course-request-delivery-v86.js?v=20260824.86' sw.js
          grep -q './quiz-randomizer.js?v=20260824.83' sw.js
          grep -q './academy-profile-support-mobile-v81.js?v=20260823.81' sw.js
          grep -q './push-notifications-v80.js?v=20260823.80' sw.js
          grep -q './push-profile-panel-v81.js?v=20260824.81' sw.js
          grep -q '.utah-v2-exam-options' quiz-randomizer.js
          grep -q "EXAM_ONLY_CODES = new Set(\['C6-25'\])" utah-auditor-hotfix-v83.js
          grep -q 'COMPLETE_PERCENTAGE = 98' utah-auditor-hotfix-v83.js
          grep -q "C3_DRIVE_ID = '1z-1qOwXlYr0hlTAEhyfZQCDjpJAigck4'" utah-c3-promo-force-v85.js
          grep -q "MODULE3_ID = '7c4d9f60-1003-4b7b-9f2c-2d5e1a8c4001'" utah-c3-promo-force-v85.js
          grep -q 'YO YA SE MANEJAR.mov' utah-c3-promo-force-v85.js
          grep -q 'forceSourceOnState' utah-c3-promo-force-v85.js
          grep -q "POLL_MS = 15000" admin-course-request-delivery-v86.js
          grep -q "table: 'support_tickets'" admin-course-request-delivery-v86.js
          grep -q "'postgres_changes'" admin-course-request-delivery-v86.js
          grep -q 'ACADEMIA_AG_ADMIN_COURSE_REQUEST_DELIVERY' admin-course-request-delivery-v86.js
          grep -q "addEventListener('push'" sw.js
          grep -q "addEventListener('notificationclick'" sw.js
          grep -q 'save_my_push_subscription' supabase/migrations/20260823233000_web_push_notifications.sql
          grep -q 'generateVAPIDKeys' supabase/functions/send-web-push/index.ts

      - name: Protect Web Push server secrets and dispatch logs
        run: |
          migration='supabase/migrations/20260823233000_web_push_notifications.sql'
          function='supabase/functions/send-web-push/index.ts'
          grep -q 'alter table public.push_server_config enable row level security' "$migration"
          grep -q 'revoke all on public.push_server_config from anon, authenticated' "$migration"
          grep -q 'alter table public.push_dispatch_log enable row level security' "$migration"
          grep -q 'revoke all on public.push_dispatch_log from anon, authenticated' "$migration"
          grep -q 'revoke all on function public.save_my_push_subscription' "$migration"
          grep -q 'grant execute on function public.save_my_push_subscription' "$migration"
          grep -q 'SERVICE_ROLE_KEY = Deno.env.get' "$function"
          grep -q 'return json({ ok: true, publicKey: config.vapid_public_key' "$function"
          ! grep -Eq 'return json\([^\n]*vapid_private_key' "$function"

      - name: Validate local assets linked from academia
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__(); self.paths = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'script' and values.get('src'): self.paths.append(values['src'])
                  if tag == 'link' and values.get('href') and values.get('rel') == 'stylesheet': self.paths.append(values['href'])
          parser = Assets(); parser.feed(Path('academia.html').read_text(encoding='utf-8'))
          missing, empty = [], []
          for raw in parser.paths:
              parsed = urlsplit(raw)
              if parsed.scheme or raw.startswith('//'): continue
              path = parsed.path.lstrip('./')
              if not path: continue
              file = Path(path)
              if not file.is_file(): missing.append(raw)
              elif file.stat().st_size == 0: empty.append(raw)
          if missing or empty: raise SystemExit(f'Missing local assets: {missing}; empty local assets: {empty}')
          print(f'Validated {len(parser.paths)} linked stylesheet/script references.')
          PY

      - name: Validate public Supabase configuration
        run: |
          grep -Eq 'https://[a-z0-9-]+\.supabase\.co' supabase-config.js
          grep -q 'publishableKey' supabase-config.js
          ! grep -qi 'TU-PROYECTO\|TU_SUPABASE\|service_role\|SUPABASE_SERVICE_ROLE' supabase-config.js
          ! grep -RniE 'service_role|SUPABASE_SERVICE_ROLE|serviceRoleKey' . --include='*.html' --include='*.js' --exclude-dir='.git'

      - name: Prevent temporary destructive cache reset
        run: |
          ! grep -q 'navigator.serviceWorker.getRegistrations' academia.html
          ! grep -q 'caches.keys' academia.html
          ! grep -q 'ag-academy-clean-reset' academia.html
