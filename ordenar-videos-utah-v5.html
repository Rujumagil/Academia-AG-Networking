<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordenar videos Utah Driver v5</title><style>body{margin:0;padding:28px;background:#071018;color:#eef6f3;font-family:Inter,Arial,sans-serif}main{max-width:1100px;margin:auto}.card{background:#0d1822;border:1px solid #294438;border-radius:18px;padding:20px;margin:18px 0}h1{margin:0 0 8px}p{color:#a9bbb5;line-height:1.55}button{border:0;border-radius:12px;background:#0d5b43;color:#fff;padding:12px 17px;font-weight:800;cursor:pointer;margin:4px}button:disabled{opacity:.45;cursor:not-allowed}textarea{width:100%;min-height:430px;background:#05090d;color:#dff3eb;border:1px solid #294438;border-radius:12px;padding:14px;box-sizing:border-box;font:12px/1.55 monospace}.progress{height:8px;background:#1b2c33;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#78c7a6}.ok{color:#78c7a6}.warn{color:#ffd27a}.err{color:#ff9999}#player{position:fixed;left:-10000px;top:-10000px;width:4px;height:4px;opacity:.001}</style></head><body><main><h1>Ordenador académico · Utah Driver v5</h1><p>Valida 124 videos por código académico. Los comerciales C1–C4 ya están preasignados con los Shorts proporcionados y “Clase 5 Video completo” se reconoce como C5 PROMO.</p><div class="card"><p id="status">Preparando API de YouTube…</p><div class="progress"><span id="bar"></span></div><p id="summary"></p><button id="start" disabled>Analizar playlist</button><button id="copy" disabled>Copiar SQL</button><button id="download" disabled>Descargar SQL</button></div><div class="card"><textarea id="output" readonly></textarea></div><div id="player"></div><script>
const PLAYLIST='PLNjZZNlnN-Kc',SEED='aiIsKF3sCo8';
const MODULES={C1:{id:'11111111-aaaa-4111-8111-111111111111',core:13,promo:14},C2:{id:'11111111-bbbb-4111-8111-111111111111',core:18,promo:19},C3:{id:'11111111-cccc-4111-8111-111111111111',core:20,promo:21},C4:{id:'11111111-dddd-4111-8111-111111111111',core:21,promo:22},C5:{id:'11111111-eeee-4111-8111-111111111111',core:20,promo:21},C6:{id:'11111111-ffff-4111-8111-111111111111',core:25,promo:null}};
const WELCOME={id:'11111111-0000-4111-8111-000000000001',position:1},CLOSING={id:'11111111-0000-4111-8111-000000000008',position:1};
const OVERRIDES={'C1 PROMO':'A2HKXlc9eLg','C2 PROMO':'XMMTev0RPt0','C3 PROMO':'mF4E5nikJnA','C4 PROMO':'-0p1n_vNymo'};
const EXPECTED=(()=>{const a=['00'];for(const [p,c] of Object.entries(MODULES)){for(let i=1;i<=c.core;i++)a.push(`${p} ${String(i).padStart(2,'0')}`);if(c.promo)a.push(`${p} PROMO`)}a.push('CIERRE ANGELICA');return a})(),EXPECTED_SET=new Set(EXPECTED);
const statusEl=document.querySelector('#status'),summary=document.querySelector('#summary'),out=document.querySelector('#output'),bar=document.querySelector('#bar'),start=document.querySelector('#start'),copy=document.querySelector('#copy'),download=document.querySelector('#download');let controller=null,sql='';
function norm(t=''){return String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim()}
function codeFromTitle(title=''){const n=norm(title);if(!n)return null;if(/BIENVENIDA/.test(n))return'00';if(/CIERRE\s+ANGELICA/.test(n)||(/MENSAJE\s+FINAL/.test(n)&&/ANGELICA/.test(n)))return'CIERRE ANGELICA';if(/CLASE\s*5/.test(n)&&/VIDEO\s+COMPLETO/.test(n))return'C5 PROMO';let m=n.match(/\bC\s*([1-6])\s*[:\-_. ]*(?:PROMO|PROMOCIONAL|COMERCIAL|PUBLICIDAD)\b/);if(m){const c=`C${Number(m[1])} PROMO`;return EXPECTED_SET.has(c)?c:null}m=n.match(/\bC\s*([1-6])\s*[:\-_. ]*0*([1-9]|1\d|2[0-5])\b/);if(!m)return null;const c=`C${Number(m[1])} ${String(Number(m[2])).padStart(2,'0')}`;return EXPECTED_SET.has(c)?c:null}
function targetFor(code){if(!code)return null;if(code==='00')return WELCOME;if(code==='CIERRE ANGELICA')return CLOSING;const m=code.match(/^(C[1-6])\s+(PROMO|\d{2})$/);if(!m)return null;const c=MODULES[m[1]],pos=m[2]==='PROMO'?c?.promo:Number(m[2]);if(!c||!pos||(m[2]!=='PROMO'&&pos>c.core))return null;return{id:c.id,position:pos}}
function esc(s){return String(s??'').replaceAll("'","''")}
function buildSql(rows){const vals=rows.map(r=>`  ('${r.target.id}'::uuid,${r.target.position},'${esc(r.id)}','${esc(r.code)}')`).join(',\n');return `begin;\nwith video_map(module_id,lesson_position,video_id,code) as (values\n${vals}\n)\nupdate public.lessons l set video_url='https://www.youtube-nocookie.com/embed/'||v.video_id||'?rel=0&playsinline=1&enablejsapi=1&modestbranding=1',updated_at=now() from video_map v where l.module_id=v.module_id and l.position=v.lesson_position;\ncommit;\n\nselect m.position as orden_seccion,m.title as seccion,l.position,l.title,l.video_url from public.lessons l join public.modules m on m.id=l.module_id where m.course_id='11111111-1111-4111-8111-111111111111'::uuid and l.video_url like 'https://www.youtube-nocookie.com/embed/%' order by m.position,l.position;`}
function getPlaylist(){return new Promise((resolve,reject)=>{let tries=0,last=[];try{controller.cuePlaylist({listType:'playlist',list:PLAYLIST,index:0})}catch(e){return reject(e)}const poll=()=>{tries++;let ids=[];try{ids=controller.getPlaylist()||[]}catch{}if(ids.length)last=[...new Set(ids)].filter(Boolean);if(tries>80||last.length>=124)return last.length?resolve(last):reject(new Error('YouTube no devolvió la playlist'));setTimeout(poll,250)};setTimeout(poll,300)})}
function titleFor(id){return new Promise(resolve=>{let tries=0;try{controller.cueVideoById(id)}catch{return resolve('')}const poll=()=>{tries++;let d={};try{d=controller.getVideoData()||{}}catch{}const t=String(d?.title??'');if(d?.video_id===id&&t)return resolve(t);if(tries>=45)return resolve(t);setTimeout(poll,180)};setTimeout(poll,180)})}
async function analyze(){start.disabled=true;copy.disabled=true;download.disabled=true;out.value='';summary.textContent='';bar.style.width='0%';try{const ids=await getPlaylist(),rows=[],seen=new Map();for(let i=0;i<ids.length;i++){statusEl.textContent=`Leyendo ${i+1} de ${ids.length}…`;bar.style.width=`${Math.round((i/ids.length)*100)}%`;let title='';try{title=await titleFor(ids[i])}catch{}const code=codeFromTitle(title),target=targetFor(code);rows.push({id:ids[i],title,code,target});if(code){if(!seen.has(code))seen.set(code,[]);seen.get(code).push(ids[i])}}
for(const [code,id] of Object.entries(OVERRIDES)){if(!seen.has(code)){const target=targetFor(code);rows.push({id,title:'Override manual',code,target});seen.set(code,[id])}}
bar.style.width='100%';const dup=[...seen.entries()].filter(([,v])=>v.length>1).map(([k])=>k),unique=rows.filter(r=>r.code&&r.target&&seen.get(r.code)?.[0]===r.id),found=new Set(unique.map(r=>r.code)),missing=EXPECTED.filter(c=>!found.has(c)),unknown=rows.filter(r=>!r.code||!r.target),complete=missing.length===0&&dup.length===0&&unique.length===124;sql=complete?buildSql(unique):'';statusEl.innerHTML=complete?'<span class="ok">Mapa completo y validado.</span>':'<span class="warn">Mapa incompleto: no ejecutes SQL todavía.</span>';summary.innerHTML=`${ids.length} videos devueltos por YouTube · <span class="ok">${unique.length}/124 códigos únicos</span> · <span class="warn">${unknown.length} sin código</span> · <span class="warn">${missing.length} faltantes</span>${dup.length?` · <span class="err">${dup.length} duplicados</span>`:''}.`;copy.disabled=!complete;download.disabled=!complete;start.disabled=false;out.value=(complete?sql:'-- AÚN NO EJECUTAR EN SUPABASE\n')+'\n\n-- DIAGNÓSTICO\n'+(missing.length?`-- FALTANTES: ${missing.join(', ')}\n`:'')+(dup.length?`-- DUPLICADOS: ${dup.join(', ')}\n`:'')+unknown.map(r=>`-- SIN CÓDIGO: ${r.id} | ${r.title||'[título no disponible]'}`).join('\n');}catch(e){statusEl.innerHTML=`<span class="err">Error:</span> ${String(e?.message||e)}`;start.disabled=false}}
window.onYouTubeIframeAPIReady=()=>{controller=new YT.Player('player',{width:'4',height:'4',videoId:SEED,playerVars:{controls:0,disablekb:1,playsinline:1},events:{onReady(){statusEl.innerHTML='<span class="ok">API lista.</span> Pulsa Analizar playlist.';start.disabled=false}}})};start.onclick=analyze;copy.onclick=async()=>{await navigator.clipboard.writeText(sql)};download.onclick=()=>{const b=new Blob([sql],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='utah-driver-video-map-124-validado.sql';a.click();URL.revokeObjectURL(a.href)};const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;document.head.appendChild(s);
</script></main></body></html>
